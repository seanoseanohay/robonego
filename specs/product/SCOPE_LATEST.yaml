feature_name: robotneg brutal multi-round negotiation
core_value: >
  Match a manual "Codex + brutal reviewer skill" bar for PR review, then use a
  skeptical judge and sticky per-role memory so humans leave the middleman seat.
summary: >
  robotneg accepts a GitHub PR URL, PR number, or local diff, runs a bounded
  negotiation between a brutal critic (reviewer-skill bar) and a claim-skeptical
  judge, keeps sticky per-role memory across rounds, and writes a Markdown
  decision report. Workers are Codex CLI read-only.

  Opt-in guarded Implementer (--fix) can apply before_merge accepts between
  rounds; default remains review-only. GitHub posting still deferred.
in_scope:
  - id: brutal-critic
    description: Critic prompt mirrors high-rigor reviewer skill (bugs over nits).
  - id: calibrated-judge
    description: Judge keeps evidenced high-severity findings; rejects noise.
  - id: sticky-memory
    description: Per-role memory files across rounds under state-dir.
  - id: multi-round
    description: Real multi-round refine loop until clean or max rounds.
  - id: pr-context
    description: PR metadata, changed file list, and diff for workers.
  - id: report
    description: Markdown outcome + JSON artifact.
  - id: guarded-fix
    description: >
      Opt-in --fix Implementer with hard guards (never not_this_pr, default
      before_merge only, confidence floor, max fixes, re-review after apply).
out_of_scope:
  - id: github-posting
    description: Posting PR comments deferred.
  - id: pi-base
    description: No Pi dependency required.
    reason: Codex CLI is the worker; orchestration stays local and small.
constraints:
  runtime: Local CLI.
  model_access: Authenticated local Codex CLI.
  safety: Critic/Judge read-only; Implementer workspace-write only under --fix guards.
  persistence: Reports + sticky memory on disk.
success_criteria:
  - Critic findings quality approaches manual brutal $reviewer on same PR.
  - Judge does not systematically erase evidenced blocker/major items.
  - Multi-round uses sticky memory and refine set for open items.
  - Report leads with GOOD TO MERGE / CHANGES NEEDED / HUMAN REVIEW REQUIRED.
