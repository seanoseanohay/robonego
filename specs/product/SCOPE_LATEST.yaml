feature_name: robotneg local negotiation MVP
core_value: >
  Remove the human middleman from adversarial PR review loops by letting two
  Codex-backed agents negotiate locally and produce a final Markdown decision
  report.
summary: >
  robotneg accepts a GitHub PR URL, PR number, or local diff context, runs a
  bounded negotiation between a picky critic and a skeptical judge, and writes a
  Markdown report describing what should happen next. Both agents may inspect the
  target repository through Codex in read-only mode.

  The MVP is local-only. It does not apply patches, post GitHub comments, or
  mutate the reviewed repository. The design keeps those capabilities as later
  pluggable sinks/actions.
in_scope:
  - id: mvp-input
    description: Accept PR URL, PR number, or current local branch diff.
  - id: mvp-context
    description: Gather PR metadata and diff text for deterministic review context.
  - id: mvp-agents
    description: Run Codex-backed critic and judge roles with shared repository visibility.
  - id: mvp-negotiation
    description: Iterate for a bounded number of rounds until agreement, no material change, or escalation.
  - id: mvp-output
    description: Write a local Markdown report with the top-line outcome first.
  - id: mvp-extensibility
    description: Keep role prompts, report rendering, and future actions separable.
out_of_scope:
  - id: auto-fix
    description: Applying code changes is deferred until report quality is proven.
    reason: Mutation requires stronger safety gates and rollback behavior.
  - id: github-posting
    description: Posting PR comments or reviews is deferred.
    reason: Local Markdown lets the negotiation policy mature before public side effects.
  - id: hosted-service
    description: No server, database, dashboard, auth, or multi-user state.
    reason: The first wedge is a personal local workflow.
  - id: pi-base
    description: Do not depend on Pi for the MVP.
    reason: Codex CLI already exists locally and matches the subscription requirement.
constraints:
  runtime: Local CLI.
  model_access: Use the authenticated local Codex CLI rather than direct API keys.
  safety: Run Codex workers read-only for MVP.
  persistence: Store reports and raw negotiation artifacts on disk.
success_criteria:
  - Running robotneg against a PR creates one Markdown report.
  - The report starts with "GOOD TO MERGE", "CHANGES NEEDED", or "HUMAN REVIEW REQUIRED".
  - Accepted findings include evidence, rationale, and concrete next action.
  - Rejected findings explain why they should not be acted on.
  - Unresolved findings explicitly say when the human is required.
references:
  - https://github.com/seanoseanohay/robotneg
